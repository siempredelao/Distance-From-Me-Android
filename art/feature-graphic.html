<!doctype html>
<!--
  The Google Play feature graphic (1024 x 500). The map shows the islands of the launcher icon, with
  a distance measured from Las Palmas de Gran Canaria to Puerto del Rosario (159 km). It has no other
  text than the name, so one picture serves every language.

  Render it with any headless browser at three times the size, then shrink it to 1024 x 500 and save
  it without transparency, as Google Play requires. For example (from the repo root):
    chrome-headless-shell --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=3 \
      --window-size=1024,500 --screenshot=feature-graphic.png art/feature-graphic.html

  The map paths are Web Mercator pixels at zoom 9, counted from the corner of tile 233/212. Coastlines
  are from Natural Earth (public domain) and, like the contours, from the Terrain Tiles on AWS (SRTM
  and ETOPO1). The name uses Fredoka SemiBold (fonts/), under the SIL Open Font License.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fredoka";
    font-weight: 600;
    src: url("fonts/Fredoka-SemiBold.ttf");
  }
  :root {
    --accent: #99CC00;
    --name: #F3F8E6;
    --ink: #0C1C04;
  }
  html, body { margin: 0; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(ellipse 70% 95% at 72% 50%, #2C6234 0%, transparent 72%),
      linear-gradient(120deg, #0E2108 0%, #183A16 55%, #0B1A05 100%);
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
  }

  /* The map, tilted back so it reads as a table top. */
  .stage {
    position: absolute;
    left: 484px;
    top: -118px;
    width: 720px;
    height: 720px;
    transform: perspective(1500px) rotateX(30deg) rotateZ(-17deg);
    transform-origin: 50% 55%;
  }
  .map {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 36px;
    box-shadow: 0 0 0 3px #4C9956, 0 14px 0 3px #0A1A06, 0 44px 70px rgba(0, 0, 0, 0.6);
  }
  .map svg { display: block; width: 100%; height: 100%; }
  .anchor { position: absolute; width: 0; height: 0; }

  #overlay { position: absolute; inset: 0; }

  /* Name and icon. */
  .brand {
    position: absolute;
    left: 66px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }
  .icon {
    width: 124px;
    height: 124px;
    border-radius: 29px;
    overflow: hidden;
    background: #4C9956;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.08);
  }
  /* The adaptive icon's foreground, cropped to the part the launcher shows (72 of 108 dp). */
  .icon img { display: block; width: 150%; margin: -25%; }
  .name {
    margin: 0 0 0 -4px;
    font-size: 96px;
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: 0.5px;
    color: var(--name);
    text-shadow: 0 5px 0 #081503, 0 14px 28px rgba(0, 0, 0, 0.5);
  }
</style>
</head>

  <svg id="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
  </svg>

  <div class="brand">
    <div class="icon"><img src="../core/design-system/src/release/res/mipmap-xxxhdpi/ic_launcher_foreground.webp" alt=""></div>
    <h1 class="name">Distance<br>From Me</h1>
  </div>

<script>
  // The line, pins and label are drawn upright, over the points of the tilted map.
  const [viewX, viewY, viewSize] = [98, 20, 1000];
  const toScreen = ([x, y]) => {
    const anchor = document.createElement("div");
    anchor.className = "anchor";
    anchor.style.left = `${(x - viewX) / viewSize * 100}%`;
    anchor.style.top = `${(y - viewY) / viewSize * 100}%`;
    document.getElementById("stage").append(anchor);
    const box = anchor.getBoundingClientRect();
    return [box.x, box.y];
  };
  const [ax, ay] = toScreen([270.1, 588.2]); // Las Palmas de Gran Canaria
  const [bx, by] = toScreen([841.0, 431.0]); // Puerto del Rosario

  const line = (attributes) => `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke-linecap="round" ${attributes}/>`;
  const pin = (x, y, fill, dot) => `
    <ellipse cx="${x + 4}" cy="${y + 2}" rx="15" ry="6" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>
    <g transform="translate(${x} ${y})">
      <path d="M0 0C-5 -15 -25 -27 -25 -48A25 25 0 0 1 25 -48C25 -27 5 -15 0 0Z"
            fill="${fill}" stroke="#0C1C04" stroke-width="4" stroke-linejoin="round"/>
      <circle cy="-48" r="9.5" fill="${dot}"/>
    </g>`;
  const angle = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
  const label = `
    <g transform="translate(${(ax + bx) / 2} ${(ay + by) / 2}) rotate(${angle}) scale(0.86)">
      <rect x="-74" y="-25" width="148" height="56" rx="28" fill="#000" fill-opacity="0.5" filter="url(#soft)"/>
      <rect x="-74" y="-28" width="148" height="56" rx="28" fill="#0C1C04" stroke="#99CC00" stroke-width="4"/>
      <text y="11.5" text-anchor="middle" font-size="34" word-spacing="4" fill="#F3F8E6">159 km</text>
    </g>`;
  document.getElementById("overlay").innerHTML +=
    line('stroke="#B6F000" stroke-opacity="0.65" stroke-width="16" filter="url(#glow)"') +
    line('stroke="#0C1C04" stroke-width="13"') +
    line('stroke="#99CC00" stroke-width="7"') +
    label + pin(bx, by, "#F3F8E6", "#0C1C04") + pin(ax, ay, "#99CC00", "#0C1C04");
</script>
